# Template: the nginx image runs envsubst on /etc/nginx/templates/*.template at
# startup, filling ${GLYPH_ADMIN_KEY} from the container environment. Only
# variables that exist in the environment are replaced, so nginx's own
# variables ($uri, $host, …) are left alone.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, so "backend" is resolved per request rather than at
    # startup (nginx would refuse to start if the backend isn't up yet)
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8000;

    location /glyph {
        try_files $uri $uri/ $uri.html /glyph/index.html;
    }

    # Saved conversations (everyone's) for the conversation list.
    # /glyph/api/conversations[/<id>] → backend /glyph/conversations[/<id>]
    # The admin key is added here, server-side, so it never reaches the
    # browser. This path is only reachable through the host nginx's /glyph
    # location, which is behind the site password.
    location /glyph/api/ {
        limit_except GET { deny all; }
        rewrite ^/glyph/api/(.*)$ /glyph/$1 break;
        proxy_pass $backend;
        proxy_set_header X-Admin-Key "${GLYPH_ADMIN_KEY}";
        proxy_set_header Host $host;
    }

    # Health check endpoint for Docker
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
